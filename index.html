<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC Vocab">
<meta name="description" content="Ôn tập từ vựng và cấu trúc TOEIC bằng thẻ ghi nhớ và quiz.">
<title>TOEIC Vocab — Ôn tập</title>
<style>
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --surface-2:#EDF0F8; --ink:#182031; --muted:#697386;
  --line:#E3E8F2; --brand:#4F46E5; --brand-2:#6366F1; --brand-soft:#EEF0FE; --ring:rgba(79,70,229,.4);
  --ok:#16A34A; --ok-bg:#DCFCE7; --bad:#DC2626; --bad-bg:#FEE2E2;
  --pos-n:#0284C7; --pos-v:#16A34A; --pos-adj:#EA580C; --pos-adv:#9333EA; --pos-prep:#0891B2; --pos-phr:#64748B; --pos-struct:#DB2777;
  --shadow:0 1px 2px rgba(24,32,49,.06), 0 6px 20px -12px rgba(24,32,49,.18);
  --r:14px; --r-lg:18px;
}
[data-theme="dark"]{
  --bg:#0D1120; --surface:#161B2B; --surface-2:#1E2537; --ink:#E7EAF3; --muted:#98A2B8;
  --line:#2A3245; --brand:#7C78F2; --brand-2:#8B87F5; --brand-soft:#20233A; --ring:rgba(124,120,242,.5);
  --ok:#34D399; --ok-bg:#0E2A22; --bad:#F87171; --bad-bg:#331717;
  --pos-n:#38BDF8; --pos-v:#34D399; --pos-adj:#FB923C; --pos-adv:#C084FC; --pos-prep:#22D3EE; --pos-phr:#94A3B8; --pos-struct:#F472B6;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:680px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; background:var(--bg)}

/* ---------- Header ---------- */
.appbar{
  position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; display:flex; align-items:center; gap:12px;
}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand-mark{width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); display:grid; place-items:center; flex:0 0 auto; box-shadow:0 4px 12px -4px var(--ring)}
.brand-mark svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-weight:800; letter-spacing:-.02em; font-size:17px; line-height:1}
.brand-name span{color:var(--muted); font-weight:600}
.brand-sub{font-size:11.5px; color:var(--muted); margin-top:2px}
.icon-btn{margin-left:auto; width:40px; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); display:grid; place-items:center; cursor:pointer}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:scale(.94)}
[data-theme="light"] .moon{display:block} [data-theme="light"] .sun{display:none}
[data-theme="dark"] .moon{display:none} [data-theme="dark"] .sun{display:block}

/* ---------- Main ---------- */
#view{flex:1; padding:14px 16px calc(80px + env(safe-area-inset-bottom))}

/* ---------- Chips ---------- */
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none; -ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-weight:600; font-size:13.5px; padding:8px 14px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:background .15s,color .15s,border-color .15s}
.chip.active{background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 4px 12px -5px var(--ring)}
.chip:active{transform:scale(.97)}

/* ---------- Toolbar ---------- */
.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.search{flex:1 1 200px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 12px; min-height:42px}
.search .ic{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.search input{border:0; outline:0; background:transparent; color:var(--ink); font-size:15px; width:100%; padding:9px 0}

/* ---------- Progress (quiz) ---------- */
.bar{flex:1; height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden}
.bar span{display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); border-radius:999px; transition:width .35s ease}
.hint-line{font-size:12.5px; color:var(--muted); margin:2px 2px 10px}
.group-h{font-size:13px; font-weight:700; color:var(--muted); margin:18px 2px 8px; letter-spacing:.01em}

/* ---------- Pills (loại từ) ---------- */
.pos-n{--accent:var(--pos-n)} .pos-v{--accent:var(--pos-v)} .pos-adj{--accent:var(--pos-adj)}
.pos-adv{--accent:var(--pos-adv)} .pos-prep{--accent:var(--pos-prep)} .pos-phr{--accent:var(--pos-phr)}
.pos-struct{--accent:var(--pos-struct)}
.pill{display:inline-flex; align-items:center; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--accent); color:#fff; white-space:nowrap; letter-spacing:.01em}
@supports (background: color-mix(in srgb, red, white)){
  .pill{background:color-mix(in srgb, var(--accent) 15%, var(--surface)); color:color-mix(in srgb, var(--accent) 78%, var(--ink))}
}
.pos-n-ink{color:var(--pos-n)} .pos-v-ink{color:var(--pos-v)} .pos-adj-ink{color:var(--pos-adj)}
.pos-adv-ink{color:var(--pos-adv)} .pos-struct-ink{color:var(--pos-struct)}
.pos-prep-ink{color:var(--pos-prep)} .pos-phr-ink{color:var(--pos-phr)}

/* ---------- Family cards (Tổng hợp) ---------- */
.fam-list{display:flex; flex-direction:column; gap:10px}
.fam-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow)}
.fam-head{width:100%; display:flex; align-items:center; gap:10px; padding:13px 15px; background:transparent; border:0; cursor:pointer; color:var(--ink); text-align:left}
.fam-base{font-weight:800; font-size:17px; letter-spacing:-.01em}
.tag-user{font-size:10px; font-weight:700; color:var(--brand); background:var(--brand-soft); padding:2px 7px; border-radius:6px}
.fam-count{margin-left:auto; font-size:12px; color:var(--muted)}
.fam-head .chev{width:18px;height:18px;stroke:var(--muted);transition:transform .2s}
.fam-card.collapsed .chev{transform:rotate(-90deg)}
.fam-card.collapsed .fam-body{display:none}
.fam-body{padding:0 15px 12px}
.fam-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line)}
.fam-row .pill{flex:0 0 auto}
.fam-word{font-weight:700; font-size:15px; flex:0 0 auto}
.fam-vi{color:var(--muted); font-size:13.5px; margin-left:auto; text-align:right}
.fam-syn{margin-top:8px; font-size:13px; color:var(--pos-struct)}
.fam-note{margin-top:6px; font-size:12.5px; color:var(--muted); font-style:italic}

/* ---------- Flashcards (POS + Cấu trúc) ---------- */
.card-grid{display:grid; grid-template-columns:1fr; gap:10px}
@media(min-width:560px){.card-grid{grid-template-columns:1fr 1fr}}
.fcard{position:relative; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent,var(--brand)); border-radius:var(--r); padding:13px 14px 12px; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s}
.fcard:active{transform:scale(.99)}
.fcard-top{display:flex; align-items:center; gap:8px; margin-bottom:6px}
.fcard-term{font-size:21px; font-weight:800; letter-spacing:-.01em; word-break:break-word}
.struct-term{font-size:17px; color:var(--pos-struct)}
.fcard-meaning{display:none; margin-top:8px; padding-top:9px; border-top:1px dashed var(--line); font-size:15px; color:var(--ink); animation:fade .18s ease}
.fcard.revealed .fcard-meaning{display:block}
.fcard.revealed .fcard-hint{display:none}
.fcard-sub{font-size:12.5px; color:var(--muted); margin-top:4px}
.struct-after{font-size:13px; color:var(--muted); margin-bottom:2px}
.struct-after b{color:var(--pos-struct)}
.fcard-hint{margin-top:8px; font-size:12px; color:var(--muted)}
@keyframes fade{from{opacity:0; transform:translateY(-2px)}to{opacity:1;transform:none}}

/* ---------- Empty ---------- */
.empty{text-align:center; color:var(--muted); padding:34px 16px; font-size:14px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--r)}

/* ---------- Chủ đề (Topics) ---------- */
.topic-grid{display:grid; grid-template-columns:1fr; gap:10px}
@media(min-width:560px){.topic-grid{grid-template-columns:1fr 1fr}}
.topic-card{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:var(--r); padding:14px 16px; text-align:left; cursor:pointer; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:3px; color:inherit}
.topic-card:active{transform:scale(.99)}
.topic-vi{font-weight:800; font-size:16.5px; letter-spacing:-.01em}
.topic-en{font-size:12.5px; color:var(--muted)}
.topic-count{font-size:12px; color:var(--brand); margin-top:6px; font-weight:700}
.topic-head{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.topic-head-title{display:flex; flex-direction:column}
.topic-head-vi{font-weight:800; font-size:18px}
.topic-head-en{font-size:12.5px; color:var(--muted)}
.topic-quiz-banner{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--brand-soft); color:var(--brand); padding:10px 14px; border-radius:12px; margin-bottom:14px; font-size:14px}
.topic-quiz-banner b{color:inherit}
.topic-quiz-banner button{flex:0 0 auto; background:none; border:0; color:inherit; font-weight:700; font-size:12.5px; cursor:pointer; padding:4px 8px}

/* ---------- Setup / forms ---------- */
.setup{display:flex; flex-direction:column}
.setup-h{font-size:13px; font-weight:700; color:var(--muted); margin:14px 2px 8px}
.seg{display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--line); padding:4px; border-radius:13px; margin-bottom:2px}
.seg-btn{flex:1; border:0; background:transparent; color:var(--muted); font-weight:600; font-size:13.5px; padding:9px 6px; border-radius:9px; cursor:pointer; white-space:nowrap}
.seg-btn.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.form{display:flex; flex-direction:column; gap:12px; margin-top:6px}
.fld{display:flex; flex-direction:column; gap:6px}
.fld-label{font-size:13px; font-weight:600; color:var(--muted)}
.form input,.form select{width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:11px; padding:12px 13px; font-size:15px; outline:none}
.form input:focus,.form select:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--ring)}

/* ---------- Buttons ---------- */
.btn-primary,.btn-outline,.btn-ghost,.btn-danger{font-family:inherit; font-size:15px; font-weight:700; border-radius:12px; padding:13px 16px; cursor:pointer; border:1px solid transparent; transition:transform .1s,filter .15s}
.btn-primary{background:var(--brand); color:#fff; box-shadow:0 6px 16px -8px var(--ring)}
.btn-outline{background:var(--surface); color:var(--brand); border-color:var(--brand)}
.btn-ghost{background:transparent; color:var(--muted)}
.btn-danger{background:transparent; color:var(--bad); border-color:var(--bad)}
.btn-primary:active,.btn-outline:active,.btn-ghost:active,.btn-danger:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5; box-shadow:none}
.block{display:block; width:100%; margin-top:14px}

/* ---------- Quiz runner ---------- */
.quiz-bar{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.quiz-bar .btn-ghost{padding:8px 10px; font-size:13.5px; margin-right:auto}
.quiz-count{font-size:13.5px; color:var(--muted); font-weight:600}
.quiz-score{font-size:13.5px; color:var(--ok); font-weight:700}
.quiz-progress{margin-bottom:18px}
.q-prompt{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px 18px; text-align:center; box-shadow:var(--shadow); margin-bottom:16px}
.q-sub{font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:8px}
.q-term{font-size:27px; font-weight:800; letter-spacing:-.01em; word-break:break-word; line-height:1.25}
.q-ask{font-size:13.5px; color:var(--muted); margin-top:10px}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{font-family:inherit; text-align:left; font-size:15.5px; font-weight:600; background:var(--surface); border:1.5px solid var(--line); color:var(--ink); border-radius:13px; padding:15px 16px; cursor:pointer; transition:border-color .12s,background .12s,transform .1s}
.opt:active{transform:scale(.99)}
.opt.correct{border-color:var(--ok); background:var(--ok-bg); color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg); color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.feedback{margin-top:16px; padding:13px 15px; border-radius:12px; font-size:14px; line-height:1.55}
.feedback.good{background:var(--ok-bg); color:var(--ok)}
.feedback.bad{background:var(--bad-bg); color:var(--bad)}
.feedback b{display:block; margin-bottom:2px}

/* ---------- Nối từ (matching) ---------- */
.match-wrap{display:flex; gap:10px}
.match-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px}
.match-card{font-family:inherit; text-align:left; font-size:13.5px; font-weight:600; line-height:1.3; background:var(--surface); border:1.5px solid var(--line); color:var(--ink); border-radius:12px; padding:12px 10px; min-height:44px; display:flex; align-items:center; cursor:pointer; transition:border-color .12s,background .12s,transform .1s; word-break:break-word}
.match-card:active{transform:scale(.97)}
.match-card.selected{border-color:var(--brand); background:var(--brand-soft); box-shadow:0 0 0 3px var(--ring)}
.match-card.correct{border-color:var(--ok); background:var(--ok-bg); color:var(--ok); cursor:default}
.match-card.wrong{border-color:var(--bad); background:var(--bad-bg); color:var(--bad); animation:shake .3s ease}
.match-card:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- Result ---------- */
.result{text-align:center; padding:18px 0 4px}
.result-ring{position:relative; width:132px; height:132px; border-radius:50%; margin:0 auto 14px; background:conic-gradient(var(--brand) calc(var(--p,0)*1%), var(--surface-2) 0); display:grid; place-items:center}
.result-ring::after{content:''; position:absolute; inset:11px; border-radius:50%; background:var(--surface)}
.result-pct{position:relative; z-index:1; font-size:30px; font-weight:800}
.result-msg{font-size:19px; font-weight:800}
.result-score{color:var(--muted); margin-top:4px}
.wrong-list{display:flex; flex-direction:column; gap:8px}
.wrong-item{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--bad); border-radius:12px; padding:11px 13px}
.wrong-term{font-weight:800; font-size:16px; margin-bottom:3px}
.wrong-ans{font-size:13.5px; color:var(--muted)}
.result-actions{margin-top:18px}
.result-actions .block{margin-top:10px}

/* ---------- Backup ---------- */
.info-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 15px; font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:14px}
.info-card b{color:var(--ink)}
.warn{margin-top:8px; color:var(--bad); font-weight:600}
.stat-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:6px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 8px; text-align:center}
.stat-n{font-size:24px; font-weight:800}
.stat-l{font-size:11.5px; color:var(--muted); margin-top:2px}
.file-btn{position:relative; text-align:center}

/* ---------- User list (Thêm từ) ---------- */
.user-list{display:flex; flex-direction:column; gap:8px}
.user-row{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:10px 12px}
.user-row .fam-vi{font-size:13px}
.del{flex:0 0 auto; width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); display:grid; place-items:center; cursor:pointer}
.del .ic{width:16px;height:16px;stroke:var(--bad);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Bottom nav ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
.tabbar-inner{max-width:680px; margin:0 auto; display:flex}
.nav-btn{flex:1; background:transparent; border:0; cursor:pointer; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px 8px; font-size:11px; font-weight:600}
.nav-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--brand)}
.nav-btn:active{transform:scale(.95)}

/* ---------- Toast ---------- */
#toast{position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom)); transform:translate(-50%,20px); background:var(--ink); color:var(--surface); font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:50; max-width:90%; text-align:center}
#toast.show{opacity:1; transform:translate(-50%,0)}

:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 5.5A2 2 0 0 1 5 4h5v15H5a2 2 0 0 0-2 1.5z"/><path d="M21 5.5A2 2 0 0 0 19 4h-5v15h5a2 2 0 0 1 2 1.5z"/></svg>
      </div>
      <div>
        <div class="brand-name">TOEIC <span>Vocab</span></div>
        <div class="brand-sub">Sổ tay ôn tập của bạn</div>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" data-action="theme" aria-label="Đổi giao diện">
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main id="view"><!-- render động --></main>

  <nav class="tabbar" aria-label="Điều hướng chính">
    <div class="tabbar-inner">
      <button class="nav-btn" data-action="nav" data-view="study">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A2 2 0 0 1 6 4h6v16H6a2 2 0 0 0-2 1.2z"/><path d="M20 5.5A2 2 0 0 0 18 4h-6v16h6a2 2 0 0 1 2 1.2z"/></svg>
        <span>Học</span>
      </button>
      <button class="nav-btn" data-action="nav" data-view="topics">
        <svg viewBox="0 0 24 24"><path d="M20.59 13.41L11 3.83A2 2 0 0 0 9.59 3.24L4 3a1 1 0 0 0-1 1l.24 5.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.82z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        <span>Chủ đề</span>
      </button>
      <button class="nav-btn" data-action="nav" data-view="quiz">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>
        <span>Kiểm tra</span>
      </button>
      <button class="nav-btn" data-action="nav" data-view="add">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>Thêm từ</span>

<script>
/* ============================================================================
   TOEIC VOCAB — LOGIC ỨNG DỤNG
   Phụ thuộc: biến toàn cục TOEIC_DATA (được nhúng phía trên trong index.html)
   Không dùng framework, không phụ thuộc mạng -> tải nhanh, chạy offline.
   ============================================================================ */
(function () {
  'use strict';

  /* ---------- Lớp lưu trữ (localStorage + dự phòng bộ nhớ tạm) ---------- */
  var store = (function () {
    var ok = true, mem = {};
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); }
    catch (e) { ok = false; }
    return {
      available: ok,
      get: function (k) { try { return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return (k in mem ? mem[k] : null); } },
      set: function (k, v) { try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } },
      remove: function (k) { try { ok ? localStorage.removeItem(k) : (delete mem[k]); } catch (e) { delete mem[k]; } }
    };
  })();

  var K_USER = 'toeic_user_v1';
  var K_SET = 'toeic_settings_v1';

  /* ---------- Trạng thái người dùng ---------- */
  function loadJSON(k, fb) { try { var s = store.get(k); return s ? JSON.parse(s) : fb; } catch (e) { return fb; } }
  var userData = loadJSON(K_USER, { families: [], structures: [] });
  if (!userData.families) userData.families = [];
  if (!userData.structures) userData.structures = [];
  var settings = loadJSON(K_SET, { theme: 'light' });

  function saveUser() { store.set(K_USER, JSON.stringify(userData)); }
  function saveSettings() { store.set(K_SET, JSON.stringify(settings)); }

  /* ---------- Trạng thái giao diện ---------- */
  var state = {
    view: 'study',        // study | topics | quiz | add | backup
    cat: 'all',           // all | n | v | adj | adv | struct
    search: '',
    topic: null,          // id chủ đề đang mở trong tab Chủ đề (null = danh sách chủ đề)
    topicSearch: '',
    quizType: 'meaning',  // meaning | word | mixed | after | smeaning | smixed
    quizCount: 10,
    quizTopic: null,      // id chủ đề đang ôn trong Kiểm tra (null = ôn theo nhóm từ loại)
    quiz: null,
    addType: 'word'
  };

  /* ---------- Nhãn & màu loại từ ---------- */
  var POS = {
    n:   { full: 'Danh từ',  cls: 'pos-n' },
    v:   { full: 'Động từ',  cls: 'pos-v' },
    adj: { full: 'Tính từ',  cls: 'pos-adj' },
    adv: { full: 'Trạng từ', cls: 'pos-adv' },
    prep:{ full: 'Giới từ',  cls: 'pos-prep' },
    phr: { full: 'Cụm từ',   cls: 'pos-phr' }
  };
  var CATS = [
    { id: 'all',    label: 'Tổng hợp' },
    { id: 'v',      label: 'Động từ' },
    { id: 'n',      label: 'Danh từ' },
    { id: 'adj',    label: 'Tính từ' },
    { id: 'adv',    label: 'Trạng từ' },
    { id: 'prep',   label: 'Giới từ' },
    { id: 'struct', label: 'Cấu trúc' }
  ];

  /* ---------- Truy xuất dữ liệu gộp (gốc + người dùng thêm) ---------- */
  function families() { return TOEIC_DATA.families.concat(userData.families); }
  function structures() { return TOEIC_DATA.structures.concat(userData.structures); }

  function wordItems() {
    var out = [];
    families().forEach(function (f) {
      (f.forms || []).forEach(function (fm, i) {
        out.push({
          id: 'w:' + f.id + ':' + i,
          kind: 'word', w: fm.w, pos: fm.pos, vi: fm.vi,
          base: f.base, familyId: f.id, syn: f.syn || [], example: f.example || '',
          topics: fm.topics || []
        });
      });
    });
    return out;
  }

  /* ---------- Chủ đề (topic vocab) ---------- */
  function topicsList() { return TOEIC_DATA.topics || []; }
  function itemsForTopic(topicId) {
    return wordItems().filter(function (it) { return it.topics.indexOf(topicId) >= 0; });
  }
  function structItems() {
    return structures().map(function (s) {
      return {
        id: 's:' + s.id, kind: 'struct', pattern: s.pattern, after: s.after,
        vi: s.vi, group: s.group || 'Khác', example: s.example || ''
      };
    });
  }

  function itemsForCat(cat, includeAllStructs) {
    if (cat === 'struct') return structItems();
    if (cat === 'n' || cat === 'v' || cat === 'adj' || cat === 'adv' || cat === 'prep') {
      return wordItems().filter(function (it) { return it.pos === cat; });
    }
    // 'all'
    return includeAllStructs ? wordItems().concat(structItems()) : wordItems();
  }

  /* ---------- Tiện ích ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s || '').toLowerCase().normalize('NFC'); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function sampleDistinct(pool, n, key, exclude) {
    var seen = {}, out = [];
    if (exclude != null) seen[exclude] = true;
    shuffle(pool).forEach(function (x) {
      var k = key(x);
      if (!seen[k]) { seen[k] = true; out.push(x); }
    });
    return out.slice(0, n);
  }
  function posPill(pos) { var p = POS[pos] || POS.phr; return '<span class="pill ' + p.cls + '">' + p.full + '</span>'; }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ---------- Điều hướng & khung ---------- */
  var viewEl, navEls;
  function nav(view) { state.view = view; state.quiz = null; state.quizTopic = null; render(); }
  function setActiveNav() {
    navEls.forEach(function (b) { b.classList.toggle('active', b.dataset.view === state.view); });
  }

  function catChips() {
    return '<div class="chips" role="tablist" aria-label="Nhóm ôn tập">' + CATS.map(function (c) {
      return '<button class="chip' + (state.cat === c.id ? ' active' : '') + '" data-action="setcat" data-cat="' + c.id + '" role="tab" aria-selected="' + (state.cat === c.id) + '">' + esc(c.label) + '</button>';
    }).join('') + '</div>';
  }

  function render() {
    setActiveNav();
    if (state.view === 'study') renderStudy();
    else if (state.view === 'topics') renderTopics();
    else if (state.view === 'quiz') renderQuiz();
    else if (state.view === 'add') renderAdd();
    else if (state.view === 'backup') renderBackup();
    viewEl.scrollTop = 0;
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* ============================ HỌC ============================ */
  function renderStudy() {
    var html = '';
    html += catChips();
    html += '<div class="toolbar">' +
      '<div class="search"><svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
      '<input id="search" type="search" inputmode="search" placeholder="Tìm từ hoặc nghĩa..." value="' + esc(state.search) + '" aria-label="Tìm kiếm"></div>' +
      '</div>';

    var content = state.cat === 'all' ? studyAll() : (state.cat === 'struct' ? studyStructs() : studyPos(state.cat));
    html += '<div id="study-content">' + content + '</div>';

    viewEl.innerHTML = html;
  }

  // Tổng hợp: hiển thị theo họ từ (bảng wordform) — dạng tra cứu
  function studyAll() {
    var q = norm(state.search);
    var list = families().filter(function (f) {
      if (!q) return true;
      if (norm(f.base).indexOf(q) >= 0) return true;
      if ((f.syn || []).some(function (s) { return norm(s).indexOf(q) >= 0; })) return true;
      return (f.forms || []).some(function (fm) { return norm(fm.w).indexOf(q) >= 0 || norm(fm.vi).indexOf(q) >= 0; });
    });
    if (!list.length) return emptyState('Không tìm thấy họ từ nào khớp.');
    var out = '<div class="hint-line">' + list.length + ' họ từ · chạm tiêu đề để thu gọn</div><div class="fam-list">';
    out += list.map(function (f) {
      var rows = (f.forms || []).map(function (fm) {
        return '<div class="fam-row">' +
          posPill(fm.pos) +
          '<span class="fam-word">' + esc(fm.w) + '</span>' +
          '<span class="fam-vi">' + esc(fm.vi) + '</span></div>';
      }).join('');
      var syn = (f.syn && f.syn.length) ? '<div class="fam-syn">≈ ' + f.syn.map(esc).join(', ') + '</div>' : '';
      var note = f.note ? '<div class="fam-note">' + esc(f.note) + '</div>' : '';
      var tag = f.id.indexOf('uf_') === 0 ? '<span class="tag-user">bạn thêm</span>' : '';
      return '<section class="fam-card"><button class="fam-head" data-action="fam-toggle">' +
        '<span class="fam-base">' + esc(f.base) + '</span>' + tag +
        '<span class="fam-count">' + (f.forms || []).length + ' dạng</span>' + chevronIcon() + '</button>' +
        '<div class="fam-body">' + rows + syn + note + '</div></section>';
    }).join('');
    out += '</div>';
    return out;
  }

  // Danh từ / Động từ / Tính từ / Trạng từ: thẻ ghi nhớ (chạm để lật nghĩa)
  function studyPos(cat) {
    var q = norm(state.search);
    var items = itemsForCat(cat, false).filter(function (it) {
      if (!q) return true;
      return norm(it.w).indexOf(q) >= 0 || norm(it.vi).indexOf(q) >= 0;
    });
    // gộp trùng từ (cùng chữ + cùng nghĩa) để tránh lặp
    var seen = {}, uniq = [];
    items.forEach(function (it) { var k = it.w + '|' + it.vi; if (!seen[k]) { seen[k] = true; uniq.push(it); } });
    if (!uniq.length) return emptyState('Chưa có từ nào ở mục này.');
    return '<div class="hint-line">' + uniq.length + ' từ · chạm thẻ để xem nghĩa</div><div class="card-grid">' +
      uniq.map(function (it) { return flashCard(it); }).join('') + '</div>';
  }

  function studyStructs() {
    var q = norm(state.search);
    var items = structItems().filter(function (it) {
      if (!q) return true;
      return norm(it.pattern).indexOf(q) >= 0 || norm(it.vi).indexOf(q) >= 0;
    });
    if (!items.length) return emptyState('Không có cấu trúc nào khớp.');
    // nhóm theo group
    var groups = {};
    items.forEach(function (it) { (groups[it.group] = groups[it.group] || []).push(it); });
    var out = '<div class="hint-line">' + items.length + ' cấu trúc · chạm thẻ để xem chi tiết</div>';
    Object.keys(groups).forEach(function (g) {
      out += '<h3 class="group-h">' + esc(g) + '</h3><div class="card-grid">' +
        groups[g].map(function (it) { return structCard(it); }).join('') + '</div>';
    });
    return out;
  }

  function flashCard(it) {
    var p = POS[it.pos] || POS.phr;
    return '<div class="fcard ' + p.cls + '" data-action="reveal" data-id="' + it.id + '">' +
      '<div class="fcard-top">' + posPill(it.pos) + '</div>' +
      '<div class="fcard-term">' + esc(it.w) + '</div>' +
      '<div class="fcard-meaning">' + esc(it.vi) +
        ((it.syn && it.syn.length) ? '<div class="fcard-sub">≈ ' + it.syn.map(esc).join(', ') + '</div>' : '') +
        (it.example ? '<div class="fcard-sub">“' + esc(it.example) + '”</div>' : '') +
      '</div>' +
      '<div class="fcard-hint">Chạm để xem nghĩa</div></div>';
  }

  function structCard(it) {
    return '<div class="fcard pos-struct" data-action="reveal" data-id="' + it.id + '">' +
      '<div class="fcard-top"><span class="pill pos-struct">Cấu trúc</span></div>' +
      '<div class="fcard-term struct-term">' + esc(it.pattern) + '</div>' +
      '<div class="fcard-meaning"><div class="struct-after">theo sau bởi <b>' + esc(it.after) + '</b></div>' +
        '<div>' + esc(it.vi) + '</div>' +
        (it.example ? '<div class="fcard-sub">“' + esc(it.example) + '”</div>' : '') +
      '</div>' +
      '<div class="fcard-hint">Chạm để xem chi tiết</div></div>';
  }

  function emptyState(msg) { return '<div class="empty">' + esc(msg) + '</div>'; }

  /* ============================ CHỦ ĐỀ ============================ */
  function renderTopics() {
    if (state.topic) return renderTopicDetail();
    var tps = topicsList();
    var html = '<div class="hint-line">' + tps.length + ' chủ đề · chạm để học từ vựng theo chủ đề</div>';
    html += '<div class="topic-grid">' + tps.map(function (t) {
      var n = itemsForTopic(t.id).length;
      return '<button class="topic-card" data-action="topic-open" data-topic="' + t.id + '">' +
        '<span class="topic-vi">' + esc(t.vi) + '</span>' +
        '<span class="topic-en">' + esc(t.en) + '</span>' +
        '<span class="topic-count">' + n + ' từ</span></button>';
    }).join('') + '</div>';
    viewEl.innerHTML = html;
  }

  function renderTopicDetail() {
    var topic = topicsList().filter(function (t) { return t.id === state.topic; })[0];
    if (!topic) { state.topic = null; return renderTopics(); }
    var html = '<div class="topic-head"><button class="btn-ghost" data-action="topic-back">← Chủ đề</button>' +
      '<div class="topic-head-title"><div class="topic-head-vi">' + esc(topic.vi) + '</div>' +
      '<div class="topic-head-en">' + esc(topic.en) + '</div></div></div>';
    html += '<div class="toolbar"><div class="search"><svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
      '<input id="topicSearch" type="search" inputmode="search" placeholder="Tìm từ trong chủ đề..." value="' + esc(state.topicSearch) + '" aria-label="Tìm kiếm"></div></div>';
    html += '<div id="topic-content">' + topicContent(topic) + '</div>';
    viewEl.innerHTML = html;
  }

  function topicContent(topic) {
    var q = norm(state.topicSearch);
    var items = itemsForTopic(topic.id).filter(function (it) {
      if (!q) return true;
      return norm(it.w).indexOf(q) >= 0 || norm(it.vi).indexOf(q) >= 0;
    });
    if (!items.length) return emptyState('Không tìm thấy từ nào khớp trong chủ đề này.');
    var out = '<div class="hint-line">' + items.length + ' từ · chạm thẻ để xem nghĩa</div>';
    out += '<button class="btn-primary block" data-action="quiz-topic" data-topic="' + topic.id + '"' + (items.length < 2 ? ' disabled' : '') + '>Ôn tập chủ đề này (' + items.length + ' câu)</button>';
    out += '<div class="card-grid" style="margin-top:12px">' + items.map(function (it) { return flashCard(it); }).join('') + '</div>';
    return out;
  }

  /* ============================ KIỂM TRA (QUIZ) ============================ */
  function renderQuiz() {
    if (state.quiz) return state.quiz.mode === 'match' ? renderMatchRunner() : renderQuizRunner();
    if (state.quizTopic) return renderQuizTopicSetup();
    // màn hình thiết lập
    var isStruct = state.cat === 'struct';
    // đồng bộ loại quiz với nhóm
    if (isStruct && ['meaning', 'word', 'mixed'].indexOf(state.quizType) >= 0) state.quizType = 'after';
    if (!isStruct && ['after', 'smeaning', 'smixed'].indexOf(state.quizType) >= 0) state.quizType = 'meaning';

    var types = isStruct
      ? [{ id: 'after', label: 'Theo sau là gì?' }, { id: 'smeaning', label: 'Nghĩa cấu trúc' }, { id: 'smixed', label: 'Trộn cả hai' }, { id: 'match', label: 'Nối từ' }]
      : [{ id: 'meaning', label: 'Từ → nghĩa' }, { id: 'word', label: 'Nghĩa → từ' }, { id: 'mixed', label: 'Trộn cả hai' }, { id: 'match', label: 'Nối từ' }];

    var pool = itemsForCat(state.cat, true);
    var counts = [10, 20, 30].filter(function (n) { return n < pool.length; });
    counts.push(pool.length); // tất cả
    if (state.quizCount > pool.length) state.quizCount = pool.length;

    var html = catChips();
    html += '<div class="setup">';
    html += '<h2 class="setup-h">Chọn kiểu câu hỏi</h2>';
    html += '<div class="seg">' + types.map(function (t) {
      return '<button class="seg-btn' + (state.quizType === t.id ? ' active' : '') + '" data-action="qtype" data-qt="' + t.id + '">' + esc(t.label) + '</button>';
    }).join('') + '</div>';

    html += '<h2 class="setup-h">Số câu hỏi</h2>';
    html += '<div class="seg">' + counts.map(function (n, i) {
      var label = (n === pool.length ? 'Tất cả (' + n + ')' : String(n));
      return '<button class="seg-btn' + (state.quizCount === n ? ' active' : '') + '" data-action="qcount" data-n="' + n + '">' + label + '</button>';
    }).join('') + '</div>';

    html += '<button class="btn-primary block" data-action="start-quiz"' + (pool.length < 2 ? ' disabled' : '') + '>Bắt đầu ôn (' + Math.min(state.quizCount, pool.length) + ' câu)</button>';
    if (pool.length < 2) html += '<div class="empty">Cần ít nhất 2 mục ở nhóm này để tạo quiz.</div>';
    html += '</div>';
    viewEl.innerHTML = html;
  }

  function renderQuizTopicSetup() {
    var topic = topicsList().filter(function (t) { return t.id === state.quizTopic; })[0];
    if (!topic) { state.quizTopic = null; return renderQuiz(); }
    if (['after', 'smeaning', 'smixed'].indexOf(state.quizType) >= 0) state.quizType = 'meaning';
    var types = [{ id: 'meaning', label: 'Từ → nghĩa' }, { id: 'word', label: 'Nghĩa → từ' }, { id: 'mixed', label: 'Trộn cả hai' }, { id: 'match', label: 'Nối từ' }];
    var pool = itemsForTopic(topic.id);
    var counts = [10, 20, 30].filter(function (n) { return n < pool.length; });
    counts.push(pool.length);
    if (state.quizCount > pool.length) state.quizCount = pool.length;

    var html = '<div class="topic-quiz-banner">Đang ôn theo chủ đề: <b>' + esc(topic.vi) + '</b>' +
      '<button data-action="quiz-clear-topic">✕ Bỏ chủ đề</button></div>';
    html += '<div class="setup">';
    html += '<h2 class="setup-h">Chọn kiểu câu hỏi</h2>';
    html += '<div class="seg">' + types.map(function (t) {
      return '<button class="seg-btn' + (state.quizType === t.id ? ' active' : '') + '" data-action="qtype" data-qt="' + t.id + '">' + esc(t.label) + '</button>';
    }).join('') + '</div>';

    html += '<h2 class="setup-h">Số câu hỏi</h2>';
    html += '<div class="seg">' + counts.map(function (n) {
      var label = (n === pool.length ? 'Tất cả (' + n + ')' : String(n));
      return '<button class="seg-btn' + (state.quizCount === n ? ' active' : '') + '" data-action="qcount" data-n="' + n + '">' + label + '</button>';
    }).join('') + '</div>';

    html += '<button class="btn-primary block" data-action="start-quiz"' + (pool.length < 2 ? ' disabled' : '') + '>Bắt đầu ôn (' + Math.min(state.quizCount, pool.length) + ' câu)</button>';
    if (pool.length < 2) html += '<div class="empty">Cần ít nhất 2 từ ở chủ đề này để tạo quiz.</div>';
    html += '</div>';
    viewEl.innerHTML = html;
  }

  function buildQuestions() {
    var cat = state.cat, type = state.quizType, count = state.quizCount;
    var pool = shuffle(state.quizTopic ? itemsForTopic(state.quizTopic) : itemsForCat(cat, true));
    var wordPool = wordItems();
    var afterValues = uniqueAfterValues();
    var picked = pool.slice(0, count);

    return picked.map(function (it) {
      var kind;
      if (it.kind === 'struct') {
        kind = (cat === 'struct') ? (type === 'smixed' ? pick(['after', 'smeaning']) : type) : 'after';
      } else {
        kind = (type === 'mixed') ? pick(['meaning', 'word']) : (type === 'word' ? 'word' : 'meaning');
      }
      return makeQuestion(it, kind, wordPool, afterValues);
    });
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function uniqueAfterValues() { var s = {}; structItems().forEach(function (x) { s[x.after] = true; }); return Object.keys(s); }

  function makeQuestion(it, kind, wordPool, afterValues) {
    var q = { ref: it.id, explain: '' };
    if (kind === 'meaning') {
      var d = sampleDistinct(wordPool.filter(function (x) { return x.pos === it.pos; }), 3, function (x) { return x.vi; }, it.vi);
      var opts = shuffle([{ t: it.vi, ok: true }].concat(d.map(function (x) { return { t: x.vi, ok: false }; })));
      q.prompt = esc(it.w); q.promptSub = (POS[it.pos] || POS.phr).full; q.promptCls = (POS[it.pos] || POS.phr).cls;
      q.question = 'Từ này nghĩa là gì?';
      q.options = opts.map(function (o) { return o.t; }); q.correct = opts.map(function (o) { return o.ok; }).indexOf(true);
      q.explain = it.w + ' (' + (POS[it.pos] || POS.phr).full + ') = ' + it.vi + (it.syn && it.syn.length ? '  ·  ≈ ' + it.syn.join(', ') : '');
    } else if (kind === 'word') {
      var d2 = sampleDistinct(wordPool.filter(function (x) { return x.pos === it.pos; }), 3, function (x) { return x.w; }, it.w);
      var opts2 = shuffle([{ t: it.w, ok: true }].concat(d2.map(function (x) { return { t: x.w, ok: false }; })));
      q.prompt = esc(it.vi); q.promptSub = 'Từ loại: ' + (POS[it.pos] || POS.phr).full;
      q.question = 'Từ nào mang nghĩa này?';
      q.options = opts2.map(function (o) { return o.t; }); q.correct = opts2.map(function (o) { return o.ok; }).indexOf(true);
      q.explain = it.w + ' (' + (POS[it.pos] || POS.phr).full + ') = ' + it.vi;
    } else if (kind === 'after') {
      var others = afterValues.filter(function (v) { return v !== it.after; });
      var d3 = shuffle(others).slice(0, 3);
      var opts3 = shuffle([{ t: it.after, ok: true }].concat(d3.map(function (v) { return { t: v, ok: false }; })));
      q.prompt = esc(it.pattern); q.promptSub = 'Cấu trúc'; q.promptCls = 'pos-struct';
      q.question = 'Theo sau cấu trúc này là gì?';
      q.options = opts3.map(function (o) { return o.t; }); q.correct = opts3.map(function (o) { return o.ok; }).indexOf(true);
      q.explain = it.pattern + ' + ' + it.after + '  —  ' + it.vi + (it.example ? '  ·  vd: ' + it.example : '');
    } else { // smeaning
      var d4 = sampleDistinct(structItems(), 3, function (x) { return x.vi; }, it.vi);
      var opts4 = shuffle([{ t: it.vi, ok: true }].concat(d4.map(function (x) { return { t: x.vi, ok: false }; })));
      q.prompt = esc(it.pattern); q.promptSub = 'Cấu trúc'; q.promptCls = 'pos-struct';
      q.question = 'Cấu trúc này nghĩa là gì?';
      q.options = opts4.map(function (o) { return o.t; }); q.correct = opts4.map(function (o) { return o.ok; }).indexOf(true);
      q.explain = it.pattern + ' + ' + it.after + ' = ' + it.vi;
    }
    return q;
  }

  function startQuiz() {
    if (state.quizType === 'match') {
      var pool = shuffle(state.quizTopic ? itemsForTopic(state.quizTopic) : itemsForCat(state.cat, true));
      var items = pool.slice(0, state.quizCount);
      if (items.length < 2) { toast('Không đủ dữ liệu để tạo quiz.'); return; }
      startMatchQuiz(items);
      return;
    }
    var qs = buildQuestions();
    if (qs.length < 1) { toast('Không đủ dữ liệu để tạo quiz.'); return; }
    state.quiz = { qs: qs, i: 0, score: 0, answered: false, chosen: -1, wrong: [] };
    render();
  }

  function renderQuizRunner() {
    var qz = state.quiz, q = qz.qs[qz.i];
    var html = '<div class="quiz-bar"><button class="btn-ghost" data-action="quiz-exit">✕ Thoát</button>' +
      '<div class="quiz-count">Câu ' + (qz.i + 1) + '/' + qz.qs.length + '</div>' +
      '<div class="quiz-score">' + qz.score + ' đúng</div></div>';
    var qpct = Math.round(qz.i / qz.qs.length * 100);
    html += '<div class="bar quiz-progress"><span style="width:' + qpct + '%"></span></div>';

    html += '<div class="q-prompt">' +
      '<div class="q-sub' + (q.promptCls ? ' ' + q.promptCls + '-ink' : '') + '">' + esc(q.promptSub) + '</div>' +
      '<div class="q-term' + (q.promptCls ? ' ' + q.promptCls + '-ink' : '') + '">' + q.prompt + '</div>' +
      '<div class="q-ask">' + esc(q.question) + '</div></div>';

    html += '<div class="opts">';
    q.options.forEach(function (opt, idx) {
      var cls = 'opt';
      if (qz.answered) {
        if (idx === q.correct) cls += ' correct';
        else if (idx === qz.chosen) cls += ' wrong';
        else cls += ' dim';
      }
      html += '<button class="' + cls + '" data-action="answer" data-idx="' + idx + '"' + (qz.answered ? ' disabled' : '') + '>' + esc(opt) + '</button>';
    });
    html += '</div>';

    if (qz.answered) {
      var right = qz.chosen === q.correct;
      html += '<div class="feedback ' + (right ? 'good' : 'bad') + '">' +
        '<b>' + (right ? 'Chính xác!' : 'Chưa đúng.') + '</b> ' + esc(q.explain) + '</div>';
      var last = qz.i === qz.qs.length - 1;
      html += '<button class="btn-primary block" data-action="quiz-next">' + (last ? 'Xem kết quả' : 'Câu tiếp →') + '</button>';
    }
    viewEl.innerHTML = html;
  }

  function answerQuiz(idx) {
    var qz = state.quiz; if (qz.answered) return;
    qz.answered = true; qz.chosen = idx;
    var q = qz.qs[qz.i];
    if (idx === q.correct) { qz.score++; }
    else { qz.wrong.push(q); }
    renderQuizRunner();
  }
  function nextQuiz() {
    var qz = state.quiz;
    if (qz.i < qz.qs.length - 1) { qz.i++; qz.answered = false; qz.chosen = -1; renderQuizRunner(); }
    else renderQuizResult();
  }

  /* ---------- Nối từ (matching): 5 cặp mỗi vòng ---------- */
  function matchTerm(it) { return it.kind === 'struct' ? it.pattern : it.w; }

  function startMatchQuiz(items) {
    var byId = {};
    wordItems().concat(structItems()).forEach(function (it) { byId[it.id] = it; });
    state.quiz = { mode: 'match', items: items, byId: byId, roundIndex: 0, roundSize: 5, score: 0, wrong: [], round: null };
    loadMatchRound();
    render();
  }
  function currentRoundItems() {
    var qz = state.quiz, start = qz.roundIndex * qz.roundSize;
    return qz.items.slice(start, start + qz.roundSize);
  }
  function loadMatchRound() {
    var qz = state.quiz;
    var roundItems = currentRoundItems();
    var lefts = roundItems.map(function (it) { return { ref: it.id, text: matchTerm(it) }; });
    var rights = roundItems.map(function (it) { return { ref: it.id, text: it.vi }; });
    qz.round = { left: shuffle(lefts), right: shuffle(rights), matched: {}, selL: null, selR: null, wrongRefs: {}, flashWrong: null };
  }

  function renderMatchRunner() {
    var qz = state.quiz, r = qz.round;
    var totalRounds = Math.ceil(qz.items.length / qz.roundSize);
    var html = '<div class="quiz-bar"><button class="btn-ghost" data-action="quiz-exit">✕ Thoát</button>' +
      '<div class="quiz-count">Vòng ' + (qz.roundIndex + 1) + '/' + totalRounds + '</div>' +
      '<div class="quiz-score">' + qz.score + '/' + qz.items.length + ' đúng</div></div>';
    var doneBefore = qz.roundIndex * qz.roundSize;
    var doneNow = Object.keys(r.matched).length;
    var pct = Math.round((doneBefore + doneNow) / qz.items.length * 100);
    html += '<div class="bar quiz-progress"><span style="width:' + pct + '%"></span></div>';
    html += '<div class="hint-line">Chạm 1 mục bên trái rồi 1 mục bên phải để nối cặp. Nối sai sẽ được thử lại.</div>';

    function cardHtml(cell, side) {
      var cls = 'match-card';
      var sel = side === 'L' ? r.selL : r.selR;
      var isFlash = r.flashWrong && (side === 'L' ? r.flashWrong.L === cell.ref : r.flashWrong.R === cell.ref);
      if (r.matched[cell.ref]) cls += ' correct';
      else if (isFlash) cls += ' wrong';
      else if (sel === cell.ref) cls += ' selected';
      var disabled = r.matched[cell.ref] || r.flashWrong;
      return '<button class="' + cls + '" data-action="match-pick" data-side="' + side + '" data-ref="' + cell.ref + '"' + (disabled ? ' disabled' : '') + '>' + esc(cell.text) + '</button>';
    }

    html += '<div class="match-wrap">';
    html += '<div class="match-col">' + r.left.map(function (c) { return cardHtml(c, 'L'); }).join('') + '</div>';
    html += '<div class="match-col">' + r.right.map(function (c) { return cardHtml(c, 'R'); }).join('') + '</div>';
    html += '</div>';

    if (doneNow === r.left.length) {
      var isLast = (qz.roundIndex + 1) >= totalRounds;
      html += '<button class="btn-primary block" data-action="match-next-round">' + (isLast ? 'Xem kết quả' : 'Vòng tiếp theo →') + '</button>';
    }
    viewEl.innerHTML = html;
  }

  function matchPick(side, ref) {
    var qz = state.quiz; if (!qz || qz.mode !== 'match') return;
    var r = qz.round;
    if (r.matched[ref] || r.flashWrong) return;
    if (side === 'L') r.selL = (r.selL === ref) ? null : ref;
    else r.selR = (r.selR === ref) ? null : ref;
    if (!r.selL || !r.selR) { renderMatchRunner(); return; }

    if (r.selL === r.selR) {
      var ref2 = r.selL;
      r.matched[ref2] = true;
      if (r.wrongRefs[ref2]) {
        var it = qz.byId[ref2];
        var posLabel = it.kind === 'struct' ? 'Cấu trúc' : (POS[it.pos] || POS.phr).full;
        var term = matchTerm(it);
        qz.wrong.push({ ref: ref2, prompt: esc(term), explain: term + ' (' + posLabel + ') = ' + it.vi });
      } else {
        qz.score++;
      }
      r.selL = null; r.selR = null;
      renderMatchRunner();
    } else {
      r.wrongRefs[r.selL] = true; r.wrongRefs[r.selR] = true;
      r.flashWrong = { L: r.selL, R: r.selR };
      renderMatchRunner();
      setTimeout(function () {
        if (state.quiz !== qz) return;
        r.flashWrong = null; r.selL = null; r.selR = null;
        renderMatchRunner();
      }, 550);
    }
  }

  function matchNextRound() {
    var qz = state.quiz;
    var totalRounds = Math.ceil(qz.items.length / qz.roundSize);
    if (qz.roundIndex + 1 < totalRounds) { qz.roundIndex++; loadMatchRound(); renderMatchRunner(); }
    else renderQuizResult();
  }

  function renderQuizResult() {
    var qz = state.quiz, total = qz.mode === 'match' ? qz.items.length : qz.qs.length, pct = Math.round(qz.score / total * 100);
    var msg = pct >= 90 ? 'Xuất sắc!' : pct >= 70 ? 'Tốt lắm!' : pct >= 50 ? 'Khá ổn, ôn thêm nhé.' : 'Cần luyện thêm.';
    var html = '<div class="result"><div class="result-ring" style="--p:' + pct + '"><div class="result-pct">' + pct + '%</div></div>' +
      '<div class="result-msg">' + esc(msg) + '</div>' +
      '<div class="result-score">' + qz.score + '/' + total + ' câu đúng</div></div>';
    if (qz.wrong.length) {
      html += '<h3 class="group-h">Cần ôn lại (' + qz.wrong.length + ')</h3><div class="wrong-list">';
      html += qz.wrong.map(function (q) {
        return '<div class="wrong-item"><div class="wrong-term">' + q.prompt + '</div><div class="wrong-ans">' + esc(q.explain) + '</div></div>';
      }).join('');
      html += '</div>';
    } else {
      html += '<div class="empty">Bạn trả lời đúng tất cả 🎉</div>';
    }
    html += '<div class="result-actions">';
    if (qz.wrong.length) html += '<button class="btn-primary block" data-action="quiz-retry-wrong">Ôn lại ' + qz.wrong.length + ' từ sai</button>';
    html += '<button class="btn-outline block" data-action="quiz-again">Làm bộ mới</button>';
    html += '<button class="btn-ghost block" data-action="quiz-exit">Xong</button></div>';
    state.quiz.done = true;
    viewEl.innerHTML = html;
  }
  function retryWrong() {
    var wrong = state.quiz.wrong.slice();
    var byId = {}; wordItems().concat(structItems()).forEach(function (it) { byId[it.id] = it; });
    if (state.quiz.mode === 'match') {
      var items = wrong.map(function (w) { return byId[w.ref]; }).filter(Boolean);
      if (items.length < 2) { toast('Không đủ từ sai để nối lại.'); return; }
      startMatchQuiz(shuffle(items));
      return;
    }
    // dựng lại câu hỏi mới từ ref các từ sai để đảo đáp án
    var qs = wrong.map(function (q) {
      var it = byId[q.ref]; if (!it) return q;
      var kind = it.kind === 'struct' ? 'after' : 'meaning';
      // cố gắng giữ nguyên kiểu câu hỏi ban đầu dựa trên câu hỏi
      if (/nghĩa là gì/.test(q.question)) kind = it.kind === 'struct' ? 'smeaning' : 'meaning';
      else if (/Từ nào/.test(q.question)) kind = 'word';
      else if (/Theo sau/.test(q.question)) kind = 'after';
      return makeQuestion(it, kind, wordItems(), uniqueAfterValues());
    });
    state.quiz = { qs: shuffle(qs), i: 0, score: 0, answered: false, chosen: -1, wrong: [] };
    render();
  }

  /* ============================ THÊM TỪ ============================ */
  function renderAdd() {
    var isWord = state.addType === 'word';
    var html = '<div class="setup">';
    html += '<div class="seg"><button class="seg-btn' + (isWord ? ' active' : '') + '" data-action="addtype" data-t="word">Thêm từ vựng</button>' +
      '<button class="seg-btn' + (!isWord ? ' active' : '') + '" data-action="addtype" data-t="struct">Thêm cấu trúc</button></div>';

    if (isWord) {
      html += '<div class="form">' +
        field('add-w', 'Từ (tiếng Anh) *', '<input id="add-w" type="text" autocomplete="off" placeholder="vd: negotiate">') +
        field('add-pos', 'Loại từ *',
          '<select id="add-pos"><option value="v">Động từ</option><option value="n">Danh từ</option><option value="adj">Tính từ</option><option value="adv">Trạng từ</option><option value="prep">Giới từ</option><option value="phr">Cụm từ</option></select>') +
        field('add-vi', 'Nghĩa (tiếng Việt) *', '<input id="add-vi" type="text" placeholder="vd: đàm phán, thương lượng">') +
        field('add-base', 'Nhóm họ từ (tùy chọn)', '<input id="add-base" type="text" placeholder="Gõ từ gốc để gộp cùng họ, vd: negotiate">' ) +
        field('add-syn', 'Từ đồng nghĩa (tùy chọn, cách nhau dấu phẩy)', '<input id="add-syn" type="text" placeholder="vd: bargain, discuss">') +
        field('add-ex', 'Ví dụ (tùy chọn)', '<input id="add-ex" type="text" placeholder="vd: negotiate a contract">') +
        '<button class="btn-primary block" data-action="save-word">Lưu từ</button></div>';
    } else {
      html += '<div class="form">' +
        field('add-pat', 'Cấu trúc *', '<input id="add-pat" type="text" placeholder="vd: rather than">') +
        field('add-after', 'Theo sau bởi *',
          '<select id="add-after"><option value="S + V">S + V (mệnh đề)</option><option value="N">N (danh từ)</option><option value="V-ing">V-ing</option><option value="N / V-ing">N / V-ing</option><option value="to V">to V</option><option value="adj/adv">adj/adv</option></select>') +
        field('add-svi', 'Nghĩa *', '<input id="add-svi" type="text" placeholder="vd: thay vì">') +
        field('add-sgroup', 'Nhóm (tùy chọn)', '<input id="add-sgroup" type="text" placeholder="vd: Liên từ khác">') +
        field('add-sex', 'Ví dụ (tùy chọn)', '<input id="add-sex" type="text" placeholder="vd: rather than complain">') +
        '<button class="btn-primary block" data-action="save-struct">Lưu cấu trúc</button></div>';
    }
    html += '</div>';

    // danh sách đã thêm
    var uw = userData.families.reduce(function (a, f) { return a + (f.forms ? f.forms.length : 0); }, 0);
    var us = userData.structures.length;
    html += '<h3 class="group-h">Bạn đã thêm — ' + uw + ' từ, ' + us + ' cấu trúc</h3>';
    if (!uw && !us) html += '<div class="empty">Chưa có mục nào bạn tự thêm.</div>';
    else {
      html += '<div class="user-list">';
      userData.families.forEach(function (f) {
        (f.forms || []).forEach(function (fm, i) {
          html += '<div class="user-row">' + posPill(fm.pos) + '<span class="fam-word">' + esc(fm.w) + '</span><span class="fam-vi">' + esc(fm.vi) + '</span>' +
            '<button class="del" data-action="del-word" data-fid="' + f.id + '" data-i="' + i + '" aria-label="Xóa">' + trashIcon() + '</button></div>';
        });
      });
      userData.structures.forEach(function (s) {
        html += '<div class="user-row"><span class="pill pos-struct">Cấu trúc</span><span class="fam-word">' + esc(s.pattern) + '</span><span class="fam-vi">+ ' + esc(s.after) + ' · ' + esc(s.vi) + '</span>' +
          '<button class="del" data-action="del-struct" data-sid="' + s.id + '" aria-label="Xóa">' + trashIcon() + '</button></div>';
      });
      html += '</div>';
    }
    viewEl.innerHTML = html;
  }
  function field(id, label, input) {
    return '<label class="fld"><span class="fld-label">' + esc(label) + '</span>' + input + '</label>';
  }

  function saveWord() {
    var w = val('add-w'), pos = val('add-pos'), vi = val('add-vi'), base = val('add-base'), syn = val('add-syn'), ex = val('add-ex');
    if (!w || !vi) { toast('Nhập ít nhất "Từ" và "Nghĩa".'); return; }
    var synArr = syn ? syn.split(',').map(function (s) { return s.trim(); }).filter(Boolean) : [];
    var baseKey = (base || w).trim();
    // tìm họ từ đã có (chỉ trong phần người dùng thêm) để gộp
    var fam = userData.families.filter(function (f) { return norm(f.base) === norm(baseKey); })[0];
    if (!fam) { fam = { id: 'uf_' + Date.now() + '_' + Math.floor(Math.random() * 1000), base: baseKey, syn: synArr, forms: [] }; userData.families.push(fam); }
    else if (synArr.length) { fam.syn = Array.from(new Set((fam.syn || []).concat(synArr))); }
    fam.forms.push({ w: w, pos: pos, vi: vi });
    if (ex) fam.example = ex;
    saveUser(); toast('Đã thêm “' + w + '”.'); renderAdd();
  }
  function saveStruct() {
    var pat = val('add-pat'), after = val('add-after'), vi = val('add-svi'), g = val('add-sgroup'), ex = val('add-sex');
    if (!pat || !vi) { toast('Nhập ít nhất "Cấu trúc" và "Nghĩa".'); return; }
    userData.structures.push({ id: 'us_' + Date.now() + '_' + Math.floor(Math.random() * 1000), pattern: pat, after: after, vi: vi, group: g || 'Bạn tự thêm', example: ex });
    saveUser(); toast('Đã thêm cấu trúc.'); renderAdd();
  }
  function delWord(fid, i) {
    var fam = userData.families.filter(function (f) { return f.id === fid; })[0];
    if (!fam) return;
    fam.forms.splice(i, 1);
    if (!fam.forms.length) userData.families = userData.families.filter(function (f) { return f.id !== fid; });
    saveUser(); renderAdd();
  }
  function delStruct(sid) {
    userData.structures = userData.structures.filter(function (s) { return s.id !== sid; });
    saveUser(); renderAdd();
  }
  function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }

  /* ============================ SAO LƯU ============================ */
  function renderBackup() {
    var uw = userData.families.reduce(function (a, f) { return a + (f.forms ? f.forms.length : 0); }, 0);
    var html = '<div class="setup">';
    html += '<div class="info-card">Tiến độ và các từ bạn tự thêm được lưu <b>trên chính thiết bị này</b> (trình duyệt). ' +
      'Để mang sang máy/điện thoại khác, hãy tải file sao lưu rồi khôi phục ở thiết bị kia.' +
      (store.available ? '' : '<div class="warn">⚠ Trình duyệt đang chặn bộ nhớ cục bộ — dữ liệu sẽ mất khi đóng tab. Hãy tải sao lưu thường xuyên.</div>') + '</div>';

    html += '<div class="stat-grid">' +
      stat(uw, 'từ tự thêm') + stat(userData.structures.length, 'cấu trúc tự thêm') + '</div>';

    html += '<button class="btn-primary block" data-action="export">⬇ Tải file sao lưu (.json)</button>';
    html += '<label class="btn-outline block file-btn">⬆ Khôi phục từ file<input id="importFile" type="file" accept="application/json,.json" hidden></label>';
    html += '<button class="btn-ghost block" data-action="copy">Sao chép dữ liệu vào clipboard</button>';
    html += '<button class="btn-danger block" data-action="reset">Xóa toàn bộ tiến độ & từ đã thêm</button>';
    html += '</div>';
    viewEl.innerHTML = html;
  }
  function stat(n, label) { return '<div class="stat"><div class="stat-n">' + n + '</div><div class="stat-l">' + esc(label) + '</div></div>'; }

  function exportPayload() { return JSON.stringify({ app: 'toeic-vocab', version: 1, exportedAt: new Date().toISOString(), user: userData, settings: settings }, null, 2); }
  function exportData() {
    var blob = new Blob([exportPayload()], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'toeic-vocab-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('Đã tạo file sao lưu.');
  }
  function copyData() {
    var text = exportPayload();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Đã sao chép.'); }, function () { toast('Không sao chép được.'); });
    else toast('Trình duyệt không hỗ trợ sao chép.');
  }
  function importData(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        var incUser = d.user || {};
        userData.families = mergeFamilies(userData.families, incUser.families || []);
        userData.structures = mergeById(userData.structures, incUser.structures || []);
        if (d.settings && d.settings.theme) { settings.theme = d.settings.theme; applyTheme(); }
        saveUser(); saveSettings();
        toast('Đã khôi phục dữ liệu.'); render();
      } catch (e) { toast('File không hợp lệ.'); }
    };
    r.readAsText(file);
  }
  function mergeById(a, b) { var ids = {}; a.forEach(function (x) { ids[x.id] = true; }); b.forEach(function (x) { if (!ids[x.id]) a.push(x); }); return a; }
  function mergeFamilies(a, b) {
    var byId = {}; a.forEach(function (f) { byId[f.id] = f; });
    b.forEach(function (f) { if (!byId[f.id]) { a.push(f); byId[f.id] = f; } });
    return a;
  }
  function resetAll() {
    if (!confirm('Xóa toàn bộ từ bạn đã thêm? Không thể hoàn tác.')) return;
    userData = { families: [], structures: [] };
    store.remove(K_USER);
    toast('Đã xóa dữ liệu.'); nav('study');
  }

  /* ---------- Chủ đề sáng/tối ---------- */
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', settings.theme === 'dark' ? 'dark' : 'light');
    var b = document.getElementById('themeBtn');
    if (b) b.setAttribute('aria-label', settings.theme === 'dark' ? 'Chuyển nền sáng' : 'Chuyển nền tối');
  }
  function toggleTheme() { settings.theme = settings.theme === 'dark' ? 'light' : 'dark'; saveSettings(); applyTheme(); }

  /* ---------- Biểu tượng SVG ---------- */
  function chevronIcon() { return '<svg viewBox="0 0 24 24" class="ic chev"><path d="M6 9l6 6 6-6"/></svg>'; }
  function trashIcon() { return '<svg viewBox="0 0 24 24" class="ic"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>'; }

  /* ============================ SỰ KIỆN ============================ */
  function onClick(e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action;
    switch (a) {
      case 'nav': nav(t.dataset.view); break;
      case 'setcat': state.cat = t.dataset.cat; state.search = ''; render(); break;
      case 'theme': toggleTheme(); break;
      case 'fam-toggle': t.closest('.fam-card').classList.toggle('collapsed'); break;
      case 'reveal': t.classList.toggle('revealed'); break;
      case 'topic-open': state.topic = t.dataset.topic; state.topicSearch = ''; render(); break;
      case 'topic-back': state.topic = null; state.topicSearch = ''; render(); break;
      case 'quiz-topic':
        state.quizTopic = t.dataset.topic; state.quiz = null; state.quizType = 'meaning';
        state.view = 'quiz'; render(); break;
      case 'quiz-clear-topic': state.quizTopic = null; renderQuiz(); break;
      case 'qtype': state.quizType = t.dataset.qt; renderQuiz(); break;
      case 'qcount': state.quizCount = parseInt(t.dataset.n, 10); renderQuiz(); break;
      case 'start-quiz': startQuiz(); break;
      case 'answer': answerQuiz(parseInt(t.dataset.idx, 10)); break;
      case 'quiz-next': nextQuiz(); break;
      case 'match-pick': matchPick(t.dataset.side, t.dataset.ref); break;
      case 'match-next-round': matchNextRound(); break;
      case 'quiz-exit':
        var fromTopic = state.quizTopic;
        state.quiz = null; state.quizTopic = null;
        if (fromTopic) state.view = 'topics';
        render(); break;
      case 'quiz-again': state.quiz = null; renderQuiz(); break;
      case 'quiz-retry-wrong': retryWrong(); break;
      case 'addtype': state.addType = t.dataset.t; renderAdd(); break;
      case 'save-word': saveWord(); break;
      case 'save-struct': saveStruct(); break;
      case 'del-word': delWord(t.dataset.fid, parseInt(t.dataset.i, 10)); break;
      case 'del-struct': delStruct(t.dataset.sid); break;
      case 'export': exportData(); break;
      case 'copy': copyData(); break;
      case 'reset': resetAll(); break;
    }
  }
  function onInput(e) {
    if (e.target.id === 'search') { state.search = e.target.value; renderStudyContentOnly(); }
    else if (e.target.id === 'topicSearch') { state.topicSearch = e.target.value; renderTopicContentOnly(); }
  }
  function onChange(e) {
    if (e.target.id === 'importFile' && e.target.files[0]) { importData(e.target.files[0]); }
  }
  // cập nhật riêng phần nội dung khi gõ tìm kiếm (giữ focus ô input)
  function renderStudyContentOnly() {
    var holder = document.getElementById('study-content');
    if (!holder) { render(); return; }
    holder.innerHTML = state.cat === 'all' ? studyAll() : (state.cat === 'struct' ? studyStructs() : studyPos(state.cat));
  }
  // cập nhật riêng phần nội dung chủ đề khi gõ tìm kiếm (giữ focus ô input)
  function renderTopicContentOnly() {
    var holder = document.getElementById('topic-content');
    var topic = topicsList().filter(function (t) { return t.id === state.topic; })[0];
    if (!holder || !topic) { render(); return; }
    holder.innerHTML = topicContent(topic);
  }

  /* ---------- Khởi động ---------- */
  function init() {
    viewEl = document.getElementById('view');
    navEls = Array.prototype.slice.call(document.querySelectorAll('.nav-btn'));
    applyTheme();
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

})();

</script>
</body>
</html>
